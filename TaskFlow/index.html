<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>TaskFlow</title>
        <link rel="stylesheet" href="index.css">
        <script src="javascript.js" defer></script>
    </head>
    <body>
        <!-- Cabeçalho -->
        <header>
             <h1>TaskFlow</h1>
             <p>Organize seu dia de maneira mais simples</p>
        </header>

        <!-- Anotar as tarefas -->
        <main>
            <section class="anotando">
                <!-- Adicionado o id="tarefa-form" aqui -->
                <form id="tarefa-form">
                    <h3>Anote suas tarefas</h3>
                    <p class="pergunta">O que você precisa fazer hoje?</p>
                    <label for="tarefa">Nova tarefa</label>
                    <input
                        type="text"
                        id="tarefa"
                        name="tarefa"
                        placeholder="Ex: Estudar JavaScript"
                        required
                    >

                    <button type="submit">+ Adicionar tarefa</button>
                </form>
            </section>

            <!-- Lista de tarefas -->
            <section class="lista">
                <h2>Minhas tarefas</h2>

                <!-- Adicionado o id="lista-tarefas" aqui -->
                <ul id="lista-tarefas" style="list-style: none;">
                  
                    <li>
                        
                    </li>
                </ul>
            </section>
        </main>
    </body>
</html>
